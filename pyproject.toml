[project]
name = "xiaoying-knowledge-agent"
version = "0.1.0"
description = "Local-first enterprise knowledge Q&A agent with LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.8,<3",
  "langchain>=0.3,<1",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "langchain-openai>=0.2,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "jieba>=0.42.1",
  "rank-bm25>=0.2.2",
  "pymupdf>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
local-rag = ["sentence-transformers>=3,<4"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"
knowledge-agent-server = "knowledge_agent.server:main"
knowledge-agent-eval = "knowledge_agent.evaluation:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
